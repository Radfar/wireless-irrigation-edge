[env:d1]
platform = espressif8266
board = d1
framework = arduino

lib_deps =
    knolleary/PubSubClient
    tzapu/WiFiManager

build_src_filter = +<main.cpp> -<rf.cpp>


upload_protocol = esptool
; Uncomment and adjust if automatic port detection fails:
upload_port = COM5
monitor_port = COM5
board_build.filesystem = littlefs
monitor_speed = 115200

